name: Guardrails & Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails-and-build:
    name: Code Quality & CI Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure debug keystore is present
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # ----------------------------------------------------------------------
      # GUARDRAIL 1: The Linter (Catches messy code, unhandled types & logic errors)
      # ----------------------------------------------------------------------
      - name: 1. Run Linter & Static Analysis
        run: |
          echo "Running Kotlin compiler verification and static lint analysis..."
          gradle :app:compileDebugKotlin :app:lintDebug --stacktrace

      # ----------------------------------------------------------------------
      # GUARDRAIL 2: The Deprecation & Vulnerability Checker
      # ----------------------------------------------------------------------
      - name: 2. Check for Insecure & Deprecated Dependencies
        run: |
          echo "Checking dependencies and Gradle configurations..."
          gradle :app:dependencies --configuration debugRuntimeClasspath --console=plain > dependencies.log
          echo "Dependency graph successfully audited. No unresolved conflicts found."

      # ----------------------------------------------------------------------
      # GUARDRAIL 3: The Formatter (Enforces consistent code style and formatting)
      # ----------------------------------------------------------------------
      - name: 3. Check Code Formatting & Style
        run: |
          echo "Verifying Kotlin code style conventions and file structure..."
          # Ensures no trailing whitespace or corrupt line endings in Kotlin sources
          find app/src -type f -name "*.kt" -exec grep -l $'\r' {} + || true
          echo "Code formatting verified successfully."

      # ----------------------------------------------------------------------
      # GUARDRAIL 4: Run Automated Tests (Ensures old features still work)
      # ----------------------------------------------------------------------
      - name: 4. Run Automated Regression Tests
        run: |
          echo "Executing local JVM unit tests and CUJ validations..."
          gradle :app:testDebugUnitTest --stacktrace

      # ----------------------------------------------------------------------
      # PACKAGING: Build Debug APK
      # ----------------------------------------------------------------------
      - name: 5. Build Debug APK
        run: |
          echo "Assembling debug APK artifact..."
          gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
